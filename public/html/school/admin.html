<!DOCTYPE html>


<html lang="en">
<head>
  <script>
    document.documentElement.style.visibility = "hidden";
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login | Martin Luther</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico">



  <link rel="stylesheet" href="/css/school/admin.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>

<body>

  <div id="header"></div>


  <section class="admin-hero">
    <div class="admin-overlay">
      <div class="login-card">
        <h1>Admin Portal</h1>
        <p>Sign in to manage website content</p>

            <form action="/admin/login" method="POST" class="login-form">
              <div class="password-field">
                <input
                  id="admin-password"
                  type="password"
                  name="password"
                  placeholder="Enter Password"
                  required
                />
                <button
                  type="button"
                  class="password-toggle"
                  data-password-toggle
                  data-target="admin-password"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <span class="password-toggle__icon" aria-hidden="true"></span>
                </button>
              </div>


              <input
                type="text"
                name="token"
                placeholder="6-digit code"
                inputmode="numeric"
                autocomplete="one-time-code"
                pattern="[0-9]{6}"
                required
              />

              <button type="submit">Login</button>
            </form>

        <a href="/html/index.html" class="back-link">← Back to Home</a>
      </div>
    </div>
  </section>


  <div id="footer"></div>


  <script src="/js/header.js"></script>
  <script src="/js/footer.js"></script>
  <script src="/js/admin-login.js"></script>
  <script src="/js/layoutReady.js"></script>
  <script src="/js/reveal.js"></script>
</body>
</html>
